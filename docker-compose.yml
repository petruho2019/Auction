

services:

  identity:
    build:
      context: .
      dockerfile: Identity/dockerfile
    environment:
      ConnectionStrings__IdentityDatabase: ${IDENTITY_CONNECTION_STRING}
      ASPNETCORE_URLS: http://+:5555
    depends_on: 
      postgres:
        condition: service_healthy
    ports:
      - 5000:5555
    networks:
      - auction
    volumes:
      - services-data:/files
      - angular:/app/wwwroot
    healthcheck:
      test: [ "CMD", "curl", "f", "http://localhost:5555/identity/health" ]
      interval: 5s
      timeout: 5s
      retries: 5
    develop:
      watch:
        - action: rebuild
          path: .
          ignore: 
            - ./Auction
    restart: "no"

  postgres: 
    image: postgres:18.6
    container_name: postgres
    environment:
      POSTGRES_USER: ${USER_ID}
      POSTGRES_PASSWORD: ${PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - ${DB_PORT}:${DB_PORT} # TODO убрать при production
    volumes:
      - pgdata:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${USER_ID} -d ${PASSWORD}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - auction
    restart: unless-stopped

  nginx:
    container_name: nginx
    image: nginx:1.31.7
    volumes:
      # - services-data:/files
      # - ./public:/app/public:ro
      # - ./src/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - angular:/usr/share/nginx/angular-services:ro
      # - ./src/nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    depends_on: 
      identity:
        condition: service_healthy
    networks:
      - auction
    develop:
      watch:
        - action: rebuild
          path: .
          ignore: 
            - ./Auction

volumes: 
  pgdata:
  services-data:
  angular:

networks:
  auction:
    driver: bridge