# user root;
# 12 ядер у процессора
worker_processes 12;
events {
  worker_connections 4096;
}

http {

    include /etc/nginx/mime.types;

    server {
        listen 80;
        server_name auction.com;

        location /api/v1/identity {
            proxy_pass http://identity:5555;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        location = /identity {
            rewrite ^ /identity/ last;
        }

        location ~ ^/identity/([^/]+\.(?:js|css|map|json|ico|svg|png|jpg|woff2?))$ {
            alias /usr/share/nginx/angular-services/identity/angular/browser/$1;
        }

        location /identity/ {
            root /usr/share/nginx/angular-services/identity/angular/browser;
            try_files $uri $uri/index.html /identity/index.csr.html;
        }

        location = /identity/index.csr.html {
            alias /usr/share/nginx/angular-services/identity/angular/browser/index.csr.html;
        }

        location /debug/ {
            return 200 "Requested: $request_uri\nMatched: $uri\n FileName: $request_filename\n, 1: $1";
            add_header Content-Type text/plain;
        }
    }
}
